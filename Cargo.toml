[workspace]
resolver = "2"
members = [
    "crates/l2-formats",
    "crates/l2-game",
    "crates/l2-kingdom",
    "crates/l2-mods",
    "crates/l2-net",
    "crates/l2-scenario",
    "crates/l2-sim",
    "crates/l2-smk",
    "crates/l2-testkit",
    "crates/l2-view",
]

# `panic` stays unwind: `l2-game`'s hook writes the crash log (`src/crash.rs`).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.package]
edition = "2021"
license = "MIT"
