# The kingdom economy: tax, happiness, rations, health, births,
# deaths, yields, industry, castles, wages, trade and score.
#
# GENERATED, NOT AUTHORED. Rendered from l2_kingdom::tables::Tables
# ::DEFAULT, with a test asserting the two agree. Editing it here
# will fail the build; put your change in a mod instead.
#
# WHY THIS FILE IS THE POINT OF THE PROJECT
#
# docs/decisions.md C11: every one of these numbers lives inside
# Lords2.exe, clustered around 0x004D6300 and 0x004D8900, and in no
# data file anywhere. TROOPS*.ENG set an expectation that rules would
# be reachable as data; they are not. Modding the original's economy
# means patching a 1996 binary. This file is the first time these
# numbers have been text.
#
# Two conventions run through it:
#
#   * Named rows carry the array index they stand for, and it is
#     checked. The names are for you; the indices are what the
#     simulation uses, and they cannot be reordered.
#   * Ladders are arrays of tables, tried in order, and the last row
#     is the catch-all. Arrays replace whole on merge, so a mod that
#     changes one rung restates the ladder.
#
# HONEST SCOPE: every rule in this file is read by the simulation. A
# mod that changes one changes what a county harvests, mines, pays or
# feels, and crates/l2-mods/tests/simulation.rs proves that rule by
# rule by running the season pipeline twice. The one exception is
# named where it appears: kingdom.ai.personality.*.farm_style loads
# and nothing reads it. See docs/modding.md sec 11.

# --- food ------------------------------------------------------------
# A standing herd feeds five per head per season without being
# slaughtered; a slaughtered animal feeds ten; a sack feeds six.

[kingdom.food]
dairy_per_head = 5
food_per_head = 10
food_per_sack = 6

# --- grain and fields ------------------------------------------------
# max_sacks_per_field is 10. The printed manual says 5, twice, and the
# manual is wrong - docs/decisions.md C10.
# The labour divisors run the other way round than they look: the
# SMALLER divisor demands MORE labour, so turning Advanced Farming off
# makes sowing harder.

[kingdom.grain]
yield_per_sack = 12
max_sacks_per_field = 10
labour_divisor_advanced = 5
labour_divisor_basic = 2
# ...and these two are MULTIPLIERS, on the same line of the same
# branch: Grain_Grow and Grain_Harvest cap the standing crop at
# labour * this. With Advanced Farming off all three read
# labour_divisor_basic, which is one global in the original.
grow_per_worker_advanced = 10
harvest_per_worker_advanced = 3

[kingdom.field]
progress_max = 800
reclaim_per_season = 200

