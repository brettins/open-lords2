# --- the herd --------------------------------------------------------
# Cattle need tending. labour_per_head is 3: staffing is
# PctOf(labour, herd * 3), capped at staffing_max, and every point
# BELOW 100 adds a third of a point to the death rate. A herd nobody
# works loses about a third of a percent of its head a season on top
# of crowding.
# A county with no pasture at all loses half its herd - or all of it
# below no_pasture_kill_all_below head - and nothing else applies.
# calving_season multiplies births by season_bonus and culling_season
# multiplies deaths; 0 is "No Season" and turns the bonus off.

[kingdom.herd]
labour_per_head = 3
staffing_max = 200
understaffing_divisor = 3
no_pasture_density = 1000
no_pasture_kill_all_below = 6
no_pasture_divisor = 2
calving_season = 1
culling_season = 4
season_bonus_numerator = 3
season_bonus_denominator = 2

