# The kingdom economy: tax, happiness, rations, health, births,
# deaths, yields, industry, castles, wages, trade and score.
#
# GENERATED, NOT AUTHORED. Rendered from l2_kingdom::tables::Tables
# ::DEFAULT, with a test asserting the two agree. Editing it here
# will fail the build; put your change in a mod instead.
#
# WHY THIS FILE IS THE POINT OF THE PROJECT
#
# docs/decisions.md C11: every one of these numbers lives inside
# Lords2.exe, clustered around 0x004D6300 and 0x004D8900, and in no
# data file anywhere. TROOPS*.ENG set an expectation that rules would
# be reachable as data; they are not. Modding the original's economy
# means patching a 1996 binary. This file is the first time these
# numbers have been text.
#
# Two conventions run through it:
#
#   * Named rows carry the array index they stand for, and it is
#     checked. The names are for you; the indices are what the
#     simulation uses, and they cannot be reordered.
#   * Ladders are arrays of tables, tried in order, and the last row
#     is the catch-all. Arrays replace whole on merge, so a mod that
#     changes one rung restates the ladder.
#
# HONEST SCOPE: l2-mods loads and validates this file, and reports
# what a mod changed in it. The l2-kingdom simulation still reads its
# own constants rather than the table built from here. See
# docs/modding.md.

# --- food ------------------------------------------------------------
# A standing herd feeds five per head per season without being
# slaughtered; a slaughtered animal feeds ten; a sack feeds six.

[kingdom.food]
dairy_per_head = 5
food_per_head = 10
food_per_sack = 6

# --- grain and fields ------------------------------------------------
# max_sacks_per_field is 10. The printed manual says 5, twice, and the
# manual is wrong - docs/decisions.md C10.
# The labour divisors run the other way round than they look: the
# SMALLER divisor demands MORE labour, so turning Advanced Farming off
# makes sowing harder.

[kingdom.grain]
yield_per_sack = 12
max_sacks_per_field = 10
labour_divisor_advanced = 5
labour_divisor_basic = 2

[kingdom.field]
progress_max = 800
reclaim_per_season = 200

# --- random events ---------------------------------------------------

[kingdom.event]
population_cap_pct = 20
first_year = 1268

# --- seasons ---------------------------------------------------------
# death_rate is a percentage added to the health death rate; dryness is
# the seasonal push on the per-county dryness accumulator. Slot 0 is
# the original's "No Season" and is never used.

[kingdom.season.none]
index = 0
death_rate = 0
dryness = 0

[kingdom.season.spring]
index = 1
death_rate = 4
dryness = 8

[kingdom.season.summer]
index = 2
death_rate = 0
dryness = 24

[kingdom.season.autumn]
index = 3
death_rate = 2
dryness = 12

[kingdom.season.winter]
index = 4
death_rate = 8
dryness = -12

# --- rations ---------------------------------------------------------
# Food needed is ceil(people / divisor) * multiplier.
# health_delta is added to the health meter each season, by health
# band, in the band order below. Its last column is the rule players
# feel: perfect health decays under anything less than Double.
#
# ration_slope and ration_offset give the happiness a ration level is
# worth, as slope * level + offset. In the original this is not a
# table at all - it is the expression 3L - 8 at the end of
# Ration_Apply.

[kingdom.happiness]
ration_slope = 3
ration_offset = -8

[kingdom.ration.none]
index = 0
divisor = 1
multiplier = 0
health_delta = [-8, -10, -13, -16, -20]

[kingdom.ration.quarter]
index = 1
divisor = 4
multiplier = 1
health_delta = [-4, -6, -9, -12, -15]

[kingdom.ration.half]
index = 2
divisor = 2
multiplier = 1
health_delta = [-2, -4, -6, -8, -12]

[kingdom.ration.normal]
index = 3
divisor = 1
multiplier = 1
health_delta = [8, 4, 2, 1, -1]

[kingdom.ration.double]
index = 4
divisor = 1
multiplier = 2
health_delta = [12, 8, 4, 2, 0]

[kingdom.ration.triple]
index = 5
divisor = 1
multiplier = 3
health_delta = [20, 12, 6, 3, 1]

# --- health ----------------------------------------------------------
# band_ladder holds the INCLUSIVE upper bound of each band, one entry
# per band. A meter of 65 bands as 2, which is what pins the comparison
# as <= rather than <. The last entry is a real bound in the game's own
# table rather than an `else`: five bands, five bounds.

[kingdom.health]
