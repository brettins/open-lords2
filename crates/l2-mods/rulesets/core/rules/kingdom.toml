# One personality record per AI lord, in lord order.
#
# farm_style NOW TAKES EFFECT. It used to load and do nothing: the
# note here said AI_ManageFields dispatched into "one of three labour
# allocators that were never traced". There are FIVE allocators, two
# outer passes and two different functions with those two names -
# Ai_ManageCountyFarms at 0x0049DD01 for an AI realm and
# AI_ManageFields at 0x0049DFC6 for the unowned counties. All five are
# implemented; see l2_kingdom::ai_farm. 0 is an arable lord, 1 a
# grazier, 9 a mixer; anything else farms nothing.
#
# weapon_rota is the lord's weapon programme, six weapon types stepped
# through by AI turn step 12. Values index the weapon table: 0
# crossbow, 1 mace, 2 sword, 3 pike, 4 bow, 5 armour. The ten-step
# cursor visits slots 0,1,2,3,0,1,2,3,4,5, so the first four are made
# twice as often as the last two.
#
# There are four records and not five: docs/kingdom.md sec 2 says the
# lord byte runs 1..5, but a fifth record's bytes read a farm style of
# 17 where every real one reads 0, 1 or 9. A realm whose lord names no
# record sets no tax rates at all.
#
# siege_doctrine is record +0xA0 and it DOES take effect: 8 orders four
# siege towers, 9 a battering ram, 7 three catapults and a late ram,
# and anything else leaves the default of two towers. The orders are
# cumulative, so 7 and 9 also get the two towers.

