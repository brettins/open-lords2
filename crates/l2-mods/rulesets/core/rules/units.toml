# Battle combat constants: what each of the eleven troop types does when
# it fights. Read by l2-mods into an l2_sim::TroopTable.
#
# GENERATED, NOT AUTHORED. This file is rendered from
# l2_sim::TroopTable::DEFAULT and a test asserts the two agree, so
# editing it here will fail the build. To change a number for a game,
# put your change in a mod: a file with just the lines you want
# different is merged over this one.
#
#   [unit.archers]
#   armour = 4
#
# is a complete, valid mod, and leaves the other ten types and the
# archers' other five numbers exactly as they were.
#
# Where these numbers come from: docs/battle.md 6.1, read out of the
# original's per-type tick handlers and its melee attack table. In
# Lords2.exe they are instructions, not data - see docs/decisions.md
# C11. This file is the first time they have been editable.
#
# Fields:
#   index             position in the eleven-slot order; fixed, and
#                     checked, because it is the array index the
#                     simulation uses
#   melee_attack      damage per blow by strength band, best band
#                     first; four numbers, and an array replaces
#                     whole, so restate all four
#   recovery          ticks between blows suffered. THIS IS MELEE
#                     DEFENCE - there is no separate defence value.
#                     Must be at least 1
#   heavy_blow        the once-per-exchange blow, and large
#   armour            flat subtraction, missiles only; never read in
#                     a melee exchange
#   exchange          blows before attacker and defender swap roles
#   hits_per_casualty damage absorbed before one man dies. Must be at
#                     least 1
#
# Not here, on purpose: which types are siege engines. That decides
# whether the melee code runs at all rather than how hard it hits, so
# it is structure rather than balance and stays in the engine.

