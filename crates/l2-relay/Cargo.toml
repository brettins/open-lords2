[package]
name = "l2-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The join-code relay: a short code instead of an address (C254)"

# Dependency-free like `l2-net`: `docs/netcode.md` §7 requirement 2 (no C compiler,
# no build script, no crates.io), C254. `std::net` and `std::thread` only.
[dependencies]

[lib]
name = "l2_relay"
path = "src/lib.rs"

[[bin]]
name = "l2-relay"
path = "src/bin/l2-relay.rs"
