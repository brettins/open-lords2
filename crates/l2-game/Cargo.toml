[package]
name = "l2-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The application spine: the window, the input, the screens and the turn"

# **The only crate in the workspace with a window, and the only binary.**
#
# `docs/plan.md` settles the direction and it is one way:
#
#     l2-game -> l2-view    -> l2-formats
#            |-> l2-sim     -> l2-formats, l2-net
#            |-> l2-kingdom -> l2-net
#            +-> l2-mods
#
# Nothing below this crate learns that screens or input exist. `l2-sim` and
# `l2-kingdom` keep their manifests exactly as they are - that constraint
# survived a crate move and is not being spent on a user interface.
#
# `winit` and `pixels` are here and nowhere else. They came up from `l2-view`
# when it became a library of drawing: a canvas is a `Vec<u8>` and needs no GPU,
# while a window needs 124 transitive crates, and the crates that must stay
# bit-identical across machines may not be downstream of any of them.
#
# `l2-mods` is here because deciding *which* file to load is an application
# decision, not a drawing one, and because the core ruleset is loaded at start
# up - the one piece of mod work `docs/plan.md` revision 3 leaves in front of
# the game rather than behind it.
[dependencies]
l2-formats = { path = "../l2-formats" }
l2-kingdom = { path = "../l2-kingdom" }
l2-mods = { path = "../l2-mods" }
# For `l2_net::canonical` and nothing else. `src/save.rs` writes the ten fields
# `Game` adds on top of `Kingdom` through the *same* deterministic encoder
# `l2_kingdom::save` uses, so a saved game and a lockstep checksum cannot
# disagree about how an integer is spelled. It brings in no dependencies of its
# own - `l2-net` has none, deliberately (docs/netcode.md D-3).
l2-net = { path = "../l2-net" }
l2-scenario = { path = "../l2-scenario" }
l2-sim = { path = "../l2-sim" }
l2-view = { path = "../l2-view" }
pixels = "0.17.2"
winit = "0.30.13"
# Sound, and the third thing in the workspace that touches the machine rather
# than the world. It is here for the same reason `winit` is: `src/audio` opens
# an output device, and a crate that opens a device is a crate whose behaviour
# depends on which machine it is running on (`docs/netcode.md` D-3).
#
# `default-features = false` drops the optional ASIO and JACK back ends; what
# is left is WASAPI on Windows, ALSA on Linux and CoreAudio on macOS, which is
# every machine this game runs on. `cpal` is an output device and a callback —
# the decoding, the resampling and the mixing are all in `src/audio`, in about
# four hundred lines, because the alternative pulls a whole media stack in for
# 11 kHz 8-bit PCM.
#
# **Nothing in CI's Linux job builds this.** `l2-game` is excluded there on
# purpose, so `cpal`'s ALSA headers are not a new requirement on that runner.
cpal = { version = "0.16", default-features = false }

[lib]
name = "l2_game"
path = "src/lib.rs"

[[bin]]
name = "l2-game"
path = "src/main.rs"

# `tests/` reach the England turn-one fixture and the install through the
# testkit rather than each guessing at a path inside a directory the game
# rewrites. Test-only: the spine finds its own install at run time.
[dev-dependencies]
l2-testkit = { path = "../l2-testkit" }
