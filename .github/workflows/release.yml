name: Release

# Player downloads for a friend on either OS. A tag `v*` publishes a GitHub
# release; "Run workflow" builds the same archives as artifacts without one.
# Every night, if main has moved and CI passed on it, the `nightly` pre-release
# is replaced with a build of main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: anything new to build
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo go=true >> "$GITHUB_OUTPUT"; exit 0; fi
          tagged=$(gh api "repos/$REPO/git/ref/tags/nightly" -q .object.sha 2>/dev/null || true)
          if [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "nightly is already $GITHUB_SHA"; echo go=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          ci=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed" -q '.workflow_runs[0].conclusion')
          echo "CI on $GITHUB_SHA: ${ci:-not finished}"
          if [ "$ci" = "success" ]; then echo go=true >> "$GITHUB_OUTPUT"; else echo go=false >> "$GITHUB_OUTPUT"; fi

  build:
    name: build (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            package: powershell -File tools/run/package.ps1
            pattern: dist/*.zip
          # 22.04 for its older glibc: a binary built here runs on anything newer.
          - name: linux
            os: ubuntu-22.04
            package: sh tools/run/package.sh
            pattern: dist/*.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cpal's ALSA back end and winit's keyboard map are the only system
      # libraries l2-game links on Linux (crates/l2-game/Cargo.toml).
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config

      - name: Build and package
        run: ${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: open-lords2-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            The engine only: it contains none of the original game's art, sound or data.
            You need your own copy of Lords of the Realm II (GOG's edition works).
            Unpack, then run l2-game (l2-game.exe on Windows) and point it at the game folder.
            See README.txt inside the archive.

  nightly:
    name: replace the nightly pre-release
    if: github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release create nightly dist/* --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly $(date -u +%Y-%m-%d) ($short)" \
            --notes "The newest build of main, rebuilt each night that main changes and CI passes. Expect rough edges; tagged releases are steadier.

          The engine only: it contains none of the original game's art, sound or data.
          You need your own copy of Lords of the Realm II (GOG's edition works).
          Unpack, then run l2-game (l2-game.exe on Windows) and point it at the game folder.
          See README.txt inside the archive."
