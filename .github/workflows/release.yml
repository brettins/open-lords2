name: Release

# Player downloads for a friend on either OS. A tag `v*` publishes a GitHub
# release; "Run workflow" builds the same archives as artifacts without one.
# Every night, if main has moved and CI passed on it, the `nightly` pre-release
# is replaced with a build of main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: anything new to build
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo go=true >> "$GITHUB_OUTPUT"; exit 0; fi
          tagged=$(gh api "repos/$REPO/git/ref/tags/nightly" -q .object.sha 2>/dev/null || true)
          if [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "nightly is already $GITHUB_SHA"; echo go=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          ci=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed" -q '.workflow_runs[0].conclusion')
          echo "CI on $GITHUB_SHA: ${ci:-not finished}"
          if [ "$ci" = "success" ]; then echo go=true >> "$GITHUB_OUTPUT"; else echo go=false >> "$GITHUB_OUTPUT"; fi

  build:
    name: build (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            package: powershell -File tools/run/package.ps1
            pattern: dist/*.zip
          # 22.04 for its older glibc: a binary built here runs on anything newer.
          - name: linux
            os: ubuntu-22.04
            package: sh tools/run/package.sh
            pattern: dist/*.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cpal's ALSA back end and winit's keyboard map are the only system
      # libraries l2-game links on Linux (crates/l2-game/Cargo.toml).
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config

      - name: Build and package
        run: ${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: open-lords2-${{ matrix.name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/releases/README.md: every numbered release has hand-written notes.
      - name: Release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing: write the release notes, then tag"; exit 1; }
          cat "$notes" docs/releases/footer.md > "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ runner.temp }}/notes.md

  nightly:
    name: replace the nightly pre-release
    if: github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The notes list what landed since the last numbered release, skipping the
      # bookkeeping commits (ledger, census, figures, symbols, oracle checks).
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          short=$(git rev-parse --short HEAD)
          {
            echo "The newest build of main, rebuilt each night that main changes and its tests pass."
            echo "Expect rough edges; numbered releases are steadier."
            echo
            if [ -n "$last" ]; then
              echo "### Changes since $last"
              echo
              git log --no-merges --format='- %s' "$last..HEAD" \
                | grep -viE '^- (ledger|census|figures|symbols|oracle check|questions|number the|merge fixes)' | head -40
              echo
              echo "[Every commit since $last](https://github.com/$REPO/compare/$last...$short)"
            fi
            cat docs/releases/footer.md
          } > "$RUNNER_TEMP/notes.md"
          gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
          gh release create nightly dist/* --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly $(date -u +%Y-%m-%d) ($short)" --notes-file "$RUNNER_TEMP/notes.md"
