name: CI

# Every push: the full suite on Linux. Windows runs on pull requests, nightly
# and by hand: its runner takes ten minutes, and the Windows-only code (install
# lookup, folder picker, %APPDATA%) rarely changes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing here and saves a round trip when CI is the only
  # machine that reproduced the failure.
  RUST_BACKTRACE: 1

jobs:
  # A push that touches only prose (*.md, *.html) skips the build and test;
  # the document checks still run. Two prose
  # files are read by l2-game tests (sfx_tests.rs: bugs.md, trace/symbols.rs:
  # symbols.md) and count as code.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          code=$(printf '%s\n' "$files" | grep -vE '\.(md|html)$' | grep -c . || true)
          special=$(printf '%s\n' "$files" | grep -cxE 'docs/(bugs|symbols)\.md' || true)
          echo "changed: $(printf '%s\n' "$files" | grep -c .) files, $code not prose"
          if [ "$code" -gt 0 ] || [ "$special" -gt 0 ]; then echo code=true >> "$GITHUB_OUTPUT"; else echo code=false >> "$GITHUB_OUTPUT"; fi

  # Windows: pull requests, the nightly schedule and "Run workflow".
  #
  # Note there is no game install on the runner: the corpus tests read
  # LORDS2_DIR and skip when it is unset, which is deliberate — a checkout
  # without the game still has a real suite to run. What CI proves is that the
  # rules, the simulation and the decoders hold up on their own.
  test:
    name: test (windows)
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `.gitattributes` marks the symbol databases `merge=l2json`, and git will
      # not run a merge driver a repository merely names - that would be
      # executing code on checkout. A fresh runner is a fresh clone, so it has
      # to be registered here too, and
      # `keyed_json.rs::the_keyed_json_merge_driver_is_registered` is what fails
      # if this step is ever dropped.
      - name: Register the keyed JSON merge driver
        run: sh tools/symbols/install-merge-driver.sh

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log

      # Job logs need a GitHub login; annotations do not
      # (`/check-runs/<id>/annotations`). One annotation, lines joined by %0A,
      # because a step may raise only ten.
      - name: Name the failing tests
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          body=$(sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' test.log \
            | grep -E -A8 "panicked at|^test .* FAILED$|^error: " | head -150 \
            | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=failing tests::${body}"

  # The gate on every push: the whole workspace on Linux, l2-game included.
  # `winit` and `pixels` live in `l2-game` and nowhere else, so the simulation
  # building on a second OS also checks it took no platform dependency
  # (docs/netcode.md).
  linux:
    name: test (linux)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `.gitattributes` marks the symbol databases `merge=l2json`, and git will
      # not run a merge driver a repository merely names - that would be
      # executing code on checkout. A fresh runner is a fresh clone, so it has
      # to be registered here too, and
      # `keyed_json.rs::the_keyed_json_merge_driver_is_registered` is what fails
      # if this step is ever dropped.
      - name: Register the keyed JSON merge driver
        run: sh tools/symbols/install-merge-driver.sh

      # cpal's ALSA back end and winit's keyboard map (release.yml installs the same).
      - name: Linux build dependencies
        if: needs.changes.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev pkg-config

      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log

      - name: Name the failing tests
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          body=$(sed -e 's/\x1b\[[0-9;]*m//g' test.log \
            | grep -E -A8 "panicked at|^test .* FAILED$|^error: " | head -150 \
            | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=failing tests::${body}"

      # Two documents state measurements about this tree - README's test and
      # function counts, status.html's gauges. Nothing recomputed them, so they
      # drifted: README said 958 tests against 1,221, status.html said 230
      # functions named against 465. A document quoting a measurement that
      # nothing checks is a test that cannot fail, so these are generated and
      # checked here. The workspace count is read from the Test step's log;
      # re-running the suite here cost three minutes.
      # A prose-only push ran no tests, so the test count is skipped then.
      - name: Documented figures are current
        env:
          FIGURES_TEST_LOG: ${{ needs.changes.outputs.code == 'true' && 'test.log' || '' }}
          FIGURES_SKIP_TESTS: ${{ needs.changes.outputs.code != 'true' && '1' || '' }}
        run: node tools/figures/figures.js --check

      # symbols.md is generated from symbols.json the same way, and for the same
      # reason. Four agents can append to the database in an afternoon.
      - name: symbols.md is current
        run: node tools/symbols/symbols_md.js --check

      # The correction log is numbered by hand by whichever agent gets there
      # first, and five collisions happened in one day. This also catches the
      # other half: a citation of a correction that does not exist, which is
      # what `l2-kingdom` carried for weeks until C26 exposed it by accident.
      # Three rules: no duplicate correction number, every citation resolves, and
      # no citation changed number while the words around it did not. That last one
      # is a lockfile - tools/decisions/citations.lock - because the first two pass
      # happily on a citation dragged along by a renumber, which happened four times
      # in one session. Regenerate with: node tools/decisions/corrections.js --relock
      - name: Correction numbers are unique, resolve, and were not dragged
        run: node tools/decisions/corrections.js --check

      # The work ledger. `docs/plan.md`'s in-flight lists read as current long
      # after they were not, so live work is rows in docs/work.json and this
      # checks them. A runner is a fresh clone with no agent branches, so the
      # git half (a merged row still in flight, a missing branch, an unmerged
      # branch with no row) prints SKIP and says why; the schema half runs.
      # The git half is for the lead's machine, where the branches are.
      - name: Work ledger is well-formed
        run: node tools/pm/work.js --check
