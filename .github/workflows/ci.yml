name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing here and saves a round trip when CI is the only
  # machine that reproduced the failure.
  RUST_BACKTRACE: 1

jobs:
  # The real gate. Windows is where this project is developed and where the
  # game runs.
  #
  # Note there is no game install on the runner: the corpus tests read
  # LORDS2_DIR and skip when it is unset, which is deliberate — a checkout
  # without the game still has a real suite to run. What CI proves is that the
  # rules, the simulation and the decoders hold up on their own.
  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `.gitattributes` marks the symbol databases `merge=l2json`, and git will
      # not run a merge driver a repository merely names - that would be
      # executing code on checkout. A fresh runner is a fresh clone, so it has
      # to be registered here too, and
      # `keyed_json.rs::the_keyed_json_merge_driver_is_registered` is what fails
      # if this step is ever dropped.
      - name: Register the keyed JSON merge driver
        run: sh tools/symbols/install-merge-driver.sh

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Two documents state measurements about this tree - README's test and
      # function counts, status.html's gauges. Nothing recomputed them, so they
      # drifted: README said 958 tests against 1,221, status.html said 230
      # functions named against 465. A document quoting a measurement that
      # nothing checks is a test that cannot fail, so these are generated and
      # checked here. `figures.js` re-runs the suite against the warm target
      # directory, which costs a few seconds.
      - name: Documented figures are current
        run: node tools/figures/figures.js --check

      # symbols.md is generated from symbols.json the same way, and for the same
      # reason. Four agents can append to the database in an afternoon.
      - name: symbols.md is current
        run: node tools/symbols/symbols_md.js --check

      # The correction log is numbered by hand by whichever agent gets there
      # first, and five collisions happened in one day. This also catches the
      # other half: a citation of a correction that does not exist, which is
      # what `l2-kingdom` carried for weeks until C26 exposed it by accident.
      # Three rules: no duplicate correction number, every citation resolves, and
      # no citation changed number while the words around it did not. That last one
      # is a lockfile - tools/decisions/citations.lock - because the first two pass
      # happily on a citation dragged along by a renumber, which happened four times
      # in one session. Regenerate with: node tools/decisions/corrections.js --relock
      - name: Correction numbers are unique, resolve, and were not dragged
        run: node tools/decisions/corrections.js --check

  # Everything except `l2-game` is dependency-free on purpose: deterministic
  # lockstep means no floats where ordering matters, a seeded PRNG frozen
  # in-tree, and no iteration whose order depends on hashing (docs/netcode.md).
  #
  # `winit` and `pixels` live in `l2-game` and nowhere else. Building the other
  # seven crates on a different OS turns that architectural claim into
  # something checked rather than asserted: if a platform dependency creeps
  # into the simulation, this job is what notices.
  portable:
    name: simulation is platform-independent (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `.gitattributes` marks the symbol databases `merge=l2json`, and git will
      # not run a merge driver a repository merely names - that would be
      # executing code on checkout. A fresh runner is a fresh clone, so it has
      # to be registered here too, and
      # `keyed_json.rs::the_keyed_json_merge_driver_is_registered` is what fails
      # if this step is ever dropped.
      - name: Register the keyed JSON merge driver
        run: sh tools/symbols/install-merge-driver.sh

      - name: Test everything but the windowing crate
        run: cargo test --workspace --exclude l2-game
